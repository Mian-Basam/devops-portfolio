# OS patching, one host at a time, with reboot only when the kernel requires it.
#   ansible-playbook playbooks/patch.yml --limit webservers
- name: Patch servers
  hosts: all
  become: true
  serial: 1
  tasks:
    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true
        autoremove: true
      register: patch_result

    - name: Check whether a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_flag

    - name: Reboot if required
      ansible.builtin.reboot:
        reboot_timeout: 600
        msg: "Reboot by Ansible after patching"
      when: reboot_flag.stat.exists

    - name: Wait for the app to be healthy again (web servers)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ webapp_port }}/health"
      register: post_patch_health
      retries: 15
      delay: 4
      until: post_patch_health.status == 200
      when: "'webservers' in group_names"
