# Full provisioning of the environment. Safe to re-run (idempotent).
#   ansible-playbook playbooks/site.yml
#   ansible-playbook -i inventories/production/hosts.ini playbooks/site.yml --check --diff
- name: Baseline for every server
  hosts: all
  become: true
  roles:
    - role: common
      tags: [common]
    - role: node_exporter
      tags: [monitoring]

- name: Application servers
  hosts: webservers
  become: true
  roles:
    - role: webapp
      tags: [app]

- name: Load balancers
  hosts: loadbalancers
  become: true
  roles:
    - role: nginx_lb
      tags: [lb]
  post_tasks:
    - name: Smoke test through the load balancer
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ lb_listen_port }}/"
        return_content: true
      register: lb_check
      retries: 5
      delay: 2
      until: lb_check.status == 200
      tags: [lb]
