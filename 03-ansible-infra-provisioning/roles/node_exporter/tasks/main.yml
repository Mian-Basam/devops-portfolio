- name: Node exporter | system user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Node exporter | check installed version
  ansible.builtin.command: /usr/local/bin/node_exporter --version
  register: node_exporter_installed
  changed_when: false
  failed_when: false

- name: Node exporter | download and unpack
  ansible.builtin.unarchive:
    src: "{{ node_exporter_url }}"
    dest: /tmp
    remote_src: true
  when: node_exporter_version not in (node_exporter_installed.stdout | default(''))

- name: Node exporter | install binary
  ansible.builtin.copy:
    src: "/tmp/{{ node_exporter_release }}/node_exporter"
    dest: /usr/local/bin/node_exporter
    remote_src: true
    mode: "0755"
  when: node_exporter_version not in (node_exporter_installed.stdout | default(''))
  notify: Restart node_exporter

- name: Node exporter | systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
  notify: Restart node_exporter

- name: Node exporter | enabled and running
  ansible.builtin.systemd_service:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true
