- name: Firewall | allow SSH first so we never lock ourselves out
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Firewall | allow service ports
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ (firewall_allowed_tcp_ports + firewall_extra_tcp_ports) | unique | difference([22, 9100]) }}"

- name: Firewall | node_exporter only from the monitoring network
  community.general.ufw:
    rule: allow
    port: "9100"
    proto: tcp
    src: "{{ monitoring_allowed_cidr }}"

- name: Firewall | default deny incoming, enable
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
