lb_listen_port: 80
lb_algorithm: least_conn        # or round_robin (empty), ip_hash
lb_backend_port: 8000
lb_backend_group: webservers
lb_max_fails: 2
lb_fail_timeout: 10s
lb_drained_hosts: []            # hosts temporarily removed during rolling updates
monitoring_allowed_cidr: 127.0.0.1/32  # overridden by group_vars
